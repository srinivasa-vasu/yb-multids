spring:
  application:
    name: multids
  threads:
    virtual:
      enabled: true
  retry:
    initial-interval: 200
    max-interval: 5000
    multiplier: 3
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    ds1:
      driver-class-name: com.yugabyte.Driver
      url: jdbc:yugabytedb://127.0.0.2:5433/db1?load-balance=true
      username: yugabyte
      password: yugabyte
      hikari:
        pool-name: ds1-pool
        minimum-idle: 1
        maximum-pool-size: 1
        auto-commit: false
        keepalive-time: 120000
#        connection-init-sql: "begin read only; prepare warmup as SELECT 1; execute warmup; commit;"
        connection-timeout: 15000
        data-source-properties:
          ApplicationName: multids-ds1
          socketTimeout: 15
          yb-servers-refresh-interval: 180
          loginTimeout: 10
          connectTimeout: 5
    ds2:
      driver-class-name: com.yugabyte.Driver
      url: jdbc:yugabytedb://127.0.0.2:5433/db2?load-balance=true
      username: yugabyte
      password: yugabyte
      hikari:
        pool-name: ds2-pool
        minimum-idle: 1
        maximum-pool-size: 1
        auto-commit: false
        keepalive-time: 120000
#        connection-init-sql: "set yb_read_from_followers=on; prepare warmup as SELECT 1; execute warmup; commit;"
        connection-timeout: 15000
        data-source-properties:
          ApplicationName: multids-ds2
          socketTimeout: 15
          yb-servers-refresh-interval: 180
          loginTimeout: 10
          connectTimeout: 5
logging:
  level:
    com.zaxxer.hikari.HikariConfig: DEBUG
    com.zaxxer.hikari: TRACE
    com.yugabyte.Driver: TRACE
#    org.springframework.jdbc.datasource: DEBUG
#    org.springframework.transaction: TRACE

